name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"

      # PyPI never lets a version be reused, so catch mistakes here. This check and the version
      # check below are not a security boundary, because a tagged commit can edit this file. The
      # repository's tag ruleset and the pypi environment's tag policy restrict publishing.
      - name: Refuse a tag that is not on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      # No unlocked code runs from here to the upload: uv.lock pins dependencies with hashes,
      # build-constraints.txt does the same for the build backend, and --no-build rules out any
      # dependency's own build step. Keep it that way, because this job produces what gets published.
      - name: Install locked dependencies
        run: uv sync --locked --no-install-project --no-build --extra dev --python 3.12

      - name: Run tests
        env:
          PYTHONPATH: src
        run: .venv/bin/python -m pytest tests/ --ignore=tests/blender_integration_test.py -q

      - name: Build package
        run: uv build --build-constraint build-constraints.txt --require-hashes

      - name: Refuse a tag that does not match the package version
        run: test -f "dist/meshwire-${GITHUB_REF_NAME#v}-py3-none-any.whl"

      - name: Run the built wheel
        run: |
          uv pip install --no-deps "dist/meshwire-${GITHUB_REF_NAME#v}-py3-none-any.whl"
          actual="$(.venv/bin/meshwire --version)"
          test "$actual" = "meshwire ${GITHUB_REF_NAME#v}"

      # Built outside dist/: the PyPI action uploads everything in that folder.
      - name: Build addon ZIP
        run: |
          mkdir addon-zip
          .venv/bin/python scripts/package_addon.py
          mv dist/*.zip addon-zip/
          base="${GITHUB_REF_NAME#v}"
          base="$(printf '%s' "$base" | sed -E 's/(a|b|rc)[0-9]+$//')"
          test -f "addon-zip/meshwire-addon-${base}.zip"

      - name: Upload package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

      - name: Upload addon ZIP
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: addon-zip
          path: addon-zip/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/p/meshwire
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  github-release:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      # First, because checkout cleans the workspace. Only the changelog is needed.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            CHANGELOG.md
            scripts/changelog_section.py
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: addon-zip
          path: addon-zip

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          flags=""
          case "$GITHUB_REF_NAME" in
            *a*|*b*|*rc*) flags="--prerelease" ;;
          esac
          # The release notes open with this version's CHANGELOG section; the generated list of
          # pull requests follows it.
          python3 scripts/changelog_section.py "${GITHUB_REF_NAME#v}" < CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --notes-file notes.md \
            $flags dist/* addon-zip/*

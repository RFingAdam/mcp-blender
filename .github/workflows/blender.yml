name: Blender harness

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blender-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  BLENDER_DEPS: >-
    xvfb xauth libgl1 libegl1 libglx-mesa0 libgl1-mesa-dri libxi6 libxxf86vm1
    libxfixes3 libxrender1 libxkbcommon0 libsm6 libice6 libxkbcommon-x11-0 libdbus-1-3

jobs:
  # Gated: an unrecorded behavior change on a supported Blender fails the run.
  gated:
    name: Blender ${{ matrix.version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: "4.5.15"
            series: "4.5"
          - version: "5.2.3"
            series: "5.2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install system libraries
        run: |
          sudo apt-get update
          # shellcheck disable=SC2086
          sudo apt-get install -y --no-install-recommends $BLENDER_DEPS

      # Only the tarball is cached. fetch_blender.py re-checks its sha256 on
      # every use, so a poisoned cache entry is rejected.
      - name: Cache Blender tarball
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/mcp-blender/*.tar.xz
          key: blender-${{ matrix.version }}-${{ hashFiles('scripts/fetch_blender.py') }}

      - name: Install test dependencies
        run: uv sync --locked --extra dev --python 3.12

      - name: Fetch Blender
        id: fetch
        run: |
          set -e
          bin="$(uv run --locked --python 3.12 python scripts/fetch_blender.py ${{ matrix.version }} --dest "$RUNNER_TEMP/blender")"
          test -x "$bin"
          echo "bin=$bin" >> "$GITHUB_OUTPUT"

      - name: Run harness driver
        env:
          BLENDER_BIN: ${{ steps.fetch.outputs.bin }}
        run: >-
          xvfb-run -a uv run --locked --python 3.12 python -m tests.harness.driver
          --blender "$BLENDER_BIN"
          --out "$RUNNER_TEMP/runs/driver-${{ matrix.series }}"
          --check-baseline tests/harness/baselines/blender-${{ matrix.series }}.json

      # Runs even when the driver step failed so one failure does not hide the
      # other. The failed driver step still fails the job.
      - name: Run socket lane
        if: ${{ !cancelled() && steps.fetch.outcome == 'success' }}
        env:
          BLENDER_BIN: ${{ steps.fetch.outputs.bin }}
        run: >-
          xvfb-run -a uv run --locked --python 3.12 python -m tests.harness.socket_lane
          --blender "$BLENDER_BIN"
          --out "$RUNNER_TEMP/runs/socket-${{ matrix.series }}"
          --check-baseline tests/harness/baselines/socket-lane.json

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: harness-${{ matrix.version }}
          path: |
            ${{ runner.temp }}/runs
            !${{ runner.temp }}/runs/**/*.blend
            !${{ runner.temp }}/runs/**/*.blend1
            !${{ runner.temp }}/runs/**/tmp/**
          if-no-files-found: ignore
          retention-days: 14

  # Best effort: 4.2 segfaults at random inside Blender in two cases. Its
  # result never gates anything and nothing may depend on this job.
  nightly-4-2:
    name: Blender 4.2.23 (best effort)
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install system libraries
        run: |
          sudo apt-get update
          # shellcheck disable=SC2086
          sudo apt-get install -y --no-install-recommends $BLENDER_DEPS

      - name: Cache Blender tarball
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/mcp-blender/*.tar.xz
          key: blender-4.2.23-${{ hashFiles('scripts/fetch_blender.py') }}

      - name: Install test dependencies
        run: uv sync --locked --extra dev --python 3.12

      - name: Fetch Blender
        id: fetch
        run: |
          set -e
          bin="$(uv run --locked --python 3.12 python scripts/fetch_blender.py 4.2.23 --dest "$RUNNER_TEMP/blender")"
          test -x "$bin"
          echo "bin=$bin" >> "$GITHUB_OUTPUT"

      - name: Run harness driver
        env:
          BLENDER_BIN: ${{ steps.fetch.outputs.bin }}
        run: >-
          xvfb-run -a uv run --locked --python 3.12 python -m tests.harness.driver
          --blender "$BLENDER_BIN"
          --out "$RUNNER_TEMP/runs/driver-4.2"
          --check-baseline tests/harness/baselines/blender-4.2.json

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: harness-4.2.23
          path: |
            ${{ runner.temp }}/runs
            !${{ runner.temp }}/runs/**/*.blend
            !${{ runner.temp }}/runs/**/*.blend1
            !${{ runner.temp }}/runs/**/tmp/**
          if-no-files-found: ignore
          retention-days: 14

<?xml version="1.0" encoding="UTF-8"?>
<!--
  mcp-blender · brand banner
  Built from eng-mcp-suite/docs/brand/logo-template.svg.
  Glyph: g-cube. Accent: gold (#FBBF24).
  Replaces the older 800px assets/banner.svg (kept as banner-legacy.svg).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320"
     role="img" aria-label="mcp-blender — 218 Blender tools: 3D modeling, AI generation, MSFS content pipeline">
  <title>mcp-blender — 218 Blender tools: 3D modeling, AI generation, MSFS content pipeline</title>

  <defs>
    <linearGradient id="t-bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#0B1220"/>
      <stop offset="50%"  stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#0B1220"/>
    </linearGradient>

    <filter id="t-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .accent        { color: #FBBF24; }
      .accent-stroke { stroke: #FBBF24; }
      .accent-fill   { fill:   #FBBF24; }
    </style>
  </defs>

  <rect width="1280" height="320" fill="url(#t-bg)"/>

  <g stroke="#1E293B" stroke-width="0.5" opacity="0.6">
    <line x1="0" y1="40"  x2="1280" y2="40"/>
    <line x1="0" y1="80"  x2="1280" y2="80"/>
    <line x1="0" y1="240" x2="1280" y2="240"/>
    <line x1="0" y1="280" x2="1280" y2="280"/>
  </g>

  <g transform="translate(40, 40)">
    <rect x="0" y="0" width="240" height="240" rx="44" ry="44"
          fill="#0B1220" stroke="#1E293B" stroke-width="1"/>
    <rect x="12" y="12" width="216" height="216" rx="34" ry="34"
          fill="none" stroke="#1E293B" stroke-width="1" opacity="0.7"/>

    <!-- Inlined g-cube glyph -->
    <g id="glyph-slot" transform="translate(40, 40)" filter="url(#t-glow)">
      <g fill="none" class="accent-stroke" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round">
        <path d="M 36 56 L 96 56 L 96 116 L 36 116 Z"/>
        <path d="M 64 32 L 124 32 L 124 92 L 96 116" stroke-opacity="0.7"/>
        <line x1="36" y1="56" x2="64" y2="32" stroke-opacity="0.7"/>
        <line x1="96" y1="56" x2="124" y2="32" stroke-opacity="0.7"/>
        <line x1="96" y1="116" x2="124" y2="92" stroke-opacity="0.5"/>
        <line x1="64" y1="32" x2="64" y2="92" stroke-opacity="0.3" stroke-dasharray="3,3"/>
        <line x1="64" y1="92" x2="124" y2="92" stroke-opacity="0.3" stroke-dasharray="3,3"/>
        <line x1="36" y1="116" x2="64" y2="92" stroke-opacity="0.3" stroke-dasharray="3,3"/>
      </g>
    </g>
  </g>

  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif">
    <text x="320" y="170" font-size="100" font-weight="800"
          fill="#F8FAFC" letter-spacing="-3">mcp-blender</text>

    <g id="version-pill" transform="translate(720, 132)">
      <rect x="0" y="0" width="58" height="30" rx="15"
            fill="#0F172A" class="accent-stroke" stroke-width="1.5"/>
      <text x="29" y="20" font-size="14" font-weight="700"
            class="accent-fill" text-anchor="middle">v0.3.0</text>
    </g>

    <text x="320" y="208" font-size="22" font-weight="500" fill="#94A3B8">
      218 Blender tools · 3D modeling · AI generation · MSFS content pipeline
    </text>

    <g font-size="14" font-weight="600" fill="#64748B">
      <text x="320" y="240">blender 4.2+ · ai-3d · msfs · livery · pbr · geometry-nodes · sculpting</text>
    </g>

    <g transform="translate(320, 256)" font-size="13" font-weight="700">
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="62" height="22" rx="11" fill="#1E293B"/>
        <text x="31" y="15" fill="#F59E0B" text-anchor="middle">Python</text>
      </g>
      <g transform="translate(72, 0)">
        <rect x="0" y="0" width="66" height="22" rx="11" fill="#1E293B"/>
        <text x="33" y="15" fill="#FBBF24" text-anchor="middle">Blender</text>
      </g>
      <g transform="translate(148, 0)">
        <rect x="0" y="0" width="50" height="22" rx="11" fill="#1E293B"/>
        <text x="25" y="15" fill="#A78BFA" text-anchor="middle">MCP</text>
      </g>
      <g transform="translate(208, 0)">
        <rect x="0" y="0" width="44" height="22" rx="11" fill="#1E293B"/>
        <text x="22" y="15" fill="#34D399" text-anchor="middle">MIT</text>
      </g>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF7043"/>
      <stop offset="100%" style="stop-color:#E64A19"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#42A5F5"/>
      <stop offset="100%" style="stop-color:#1976D2"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="200" rx="10" fill="url(#bgGrad)"/>

  <!-- Connection lines -->
  <g stroke="url(#blueGrad)" stroke-width="2" stroke-dasharray="8,4" opacity="0.5">
    <path d="M 120 100 Q 250 50 400 100 Q 550 150 680 100" fill="none"/>
    <path d="M 120 100 Q 250 150 400 100 Q 550 50 680 100" fill="none"/>
  </g>

  <!-- Connection nodes -->
  <g filter="url(#glow)">
    <circle cx="120" cy="100" r="8" fill="#42A5F5"/>
    <circle cx="680" cy="100" r="8" fill="#42A5F5"/>
  </g>

  <!-- Stylized cube logo -->
  <g transform="translate(100, 100)">
    <polygon points="-30,-40 30,-40 40,-20 -20,-20" fill="#BF360C" opacity="0.8"/>
    <polygon points="-30,-40 -20,-20 -20,30 -30,10" fill="#D84315"/>
    <polygon points="30,-40 40,-20 40,30 30,10" fill="#E64A19"/>
    <polygon points="-20,-20 40,-20 40,30 -20,30" fill="url(#orangeGrad)"/>
  </g>

  <!-- Title -->
  <text x="200" y="90" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="url(#orangeGrad)">MCP</text>
  <text x="310" y="90" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#E0E0E0">Blender</text>

  <!-- Subtitle -->
  <text x="200" y="130" font-family="Arial, sans-serif" font-size="18" fill="#90A4AE">Control Blender via Model Context Protocol</text>

  <!-- Feature badges -->
  <g transform="translate(200, 160)">
    <rect x="0" y="0" width="80" height="24" rx="12" fill="url(#orangeGrad)" opacity="0.9"/>
    <text x="40" y="16" font-family="Arial, sans-serif" font-size="11" fill="white" text-anchor="middle">86 Tools</text>

    <rect x="90" y="0" width="60" height="24" rx="12" fill="url(#blueGrad)" opacity="0.9"/>
    <text x="120" y="16" font-family="Arial, sans-serif" font-size="11" fill="white" text-anchor="middle">MSFS</text>

    <rect x="160" y="0" width="70" height="24" rx="12" fill="#4CAF50" opacity="0.9"/>
    <text x="195" y="16" font-family="Arial, sans-serif" font-size="11" fill="white" text-anchor="middle">Liveries</text>

    <rect x="240" y="0" width="90" height="24" rx="12" fill="#9C27B0" opacity="0.9"/>
    <text x="285" y="16" font-family="Arial, sans-serif" font-size="11" fill="white" text-anchor="middle">AI Generation</text>
  </g>

  <!-- Blender version badge -->
  <g transform="translate(650, 160)">
    <rect x="0" y="0" width="100" height="24" rx="12" fill="#37474F"/>
    <text x="50" y="16" font-family="Arial, sans-serif" font-size="11" fill="#B0BEC5" text-anchor="middle">Blender 4.2+</text>
  </g>
</svg>

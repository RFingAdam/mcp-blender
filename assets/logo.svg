<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Gradient for the main shape -->
    <linearGradient id="blenderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF7043;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E64A19;stop-opacity:1" />
    </linearGradient>

    <!-- Gradient for MCP connection lines -->
    <linearGradient id="mcpGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#42A5F5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1976D2;stop-opacity:1" />
    </linearGradient>

    <!-- Glow effect -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="6" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="#1a1a2e" filter="url(#shadow)"/>
  <circle cx="256" cy="256" r="230" fill="#16213e"/>

  <!-- MCP Connection lines (orbiting) -->
  <g filter="url(#glow)" opacity="0.8">
    <!-- Outer orbit -->
    <ellipse cx="256" cy="256" rx="200" ry="60" fill="none" stroke="url(#mcpGrad)" stroke-width="2" stroke-dasharray="10,5" transform="rotate(-20 256 256)"/>
    <ellipse cx="256" cy="256" rx="200" ry="60" fill="none" stroke="url(#mcpGrad)" stroke-width="2" stroke-dasharray="10,5" transform="rotate(40 256 256)"/>
    <ellipse cx="256" cy="256" rx="200" ry="60" fill="none" stroke="url(#mcpGrad)" stroke-width="2" stroke-dasharray="10,5" transform="rotate(100 256 256)"/>
  </g>

  <!-- Connection nodes -->
  <g filter="url(#glow)">
    <circle cx="100" cy="180" r="12" fill="#42A5F5"/>
    <circle cx="412" cy="200" r="12" fill="#42A5F5"/>
    <circle cx="150" cy="380" r="12" fill="#42A5F5"/>
    <circle cx="380" cy="350" r="12" fill="#42A5F5"/>
  </g>

  <!-- Stylized Blender logo (simplified 3D cube) -->
  <g transform="translate(256, 256)" filter="url(#shadow)">
    <!-- Back face -->
    <polygon points="-60,-80 60,-80 80,-40 -40,-40" fill="#BF360C" opacity="0.8"/>

    <!-- Left face -->
    <polygon points="-60,-80 -40,-40 -40,60 -60,20" fill="#D84315"/>

    <!-- Top face -->
    <polygon points="-60,-80 60,-80 40,-120 -80,-120" fill="url(#blenderGrad)"/>

    <!-- Right face -->
    <polygon points="60,-80 80,-40 80,60 60,20" fill="#E64A19"/>

    <!-- Front face -->
    <polygon points="-40,-40 80,-40 80,60 -40,60" fill="url(#blenderGrad)"/>

    <!-- Bottom face hint -->
    <polygon points="-40,60 80,60 60,100 -60,100" fill="#BF360C"/>
  </g>

  <!-- AI sparkle effect -->
  <g fill="#FFD54F" filter="url(#glow)">
    <polygon points="320,120 325,135 340,140 325,145 320,160 315,145 300,140 315,135" />
    <polygon points="180,100 183,110 193,113 183,116 180,126 177,116 167,113 177,110" transform="scale(0.7) translate(80, 50)"/>
  </g>

  <!-- MCP text badge -->
  <g transform="translate(256, 420)">
    <rect x="-50" y="-15" width="100" height="30" rx="15" fill="#42A5F5"/>
    <text x="0" y="6" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white" text-anchor="middle">MCP</text>
  </g>

  <!-- Blender text -->
  <text x="256" y="480" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#E0E0E0" text-anchor="middle">BLENDER</text>
</svg>

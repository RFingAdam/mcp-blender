<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="blenderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF8A65"/>
      <stop offset="100%" style="stop-color:#E64A19"/>
    </linearGradient>
    <linearGradient id="mcpGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#64B5F6"/>
      <stop offset="100%" style="stop-color:#1565C0"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f1a"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <circle cx="256" cy="256" r="250" fill="url(#bgGrad)"/>
  <circle cx="256" cy="256" r="240" fill="none" stroke="#1e3a5f" stroke-width="1" opacity="0.3"/>

  <!-- Orbital rings -->
  <g opacity="0.2" stroke="url(#mcpGrad)" stroke-width="1.5" fill="none">
    <ellipse cx="256" cy="256" rx="210" ry="70" transform="rotate(-25 256 256)" stroke-dasharray="8,6"/>
    <ellipse cx="256" cy="256" rx="210" ry="70" transform="rotate(35 256 256)" stroke-dasharray="8,6"/>
    <ellipse cx="256" cy="256" rx="210" ry="70" transform="rotate(95 256 256)" stroke-dasharray="8,6"/>
  </g>

  <!-- Connection nodes on orbits -->
  <g filter="url(#glow)">
    <circle cx="85" cy="195" r="10" fill="#42A5F5" opacity="0.8"/>
    <circle cx="427" cy="195" r="10" fill="#42A5F5" opacity="0.8"/>
    <circle cx="140" cy="390" r="10" fill="#42A5F5" opacity="0.7"/>
    <circle cx="372" cy="370" r="10" fill="#42A5F5" opacity="0.7"/>
    <circle cx="256" cy="72" r="8" fill="#42A5F5" opacity="0.6"/>
    <circle cx="440" cy="310" r="8" fill="#42A5F5" opacity="0.6"/>
  </g>

  <!-- 3D Cube - center piece -->
  <g transform="translate(256, 240)" filter="url(#shadow)">
    <!-- Back top edge -->
    <polygon points="-70,-95 70,-95 90,-50 -50,-50" fill="#BF360C" opacity="0.8"/>
    <!-- Left face -->
    <polygon points="-70,-95 -50,-50 -50,65 -70,20" fill="#D84315"/>
    <!-- Right face -->
    <polygon points="70,-95 90,-50 90,65 70,20" fill="#E64A19"/>
    <!-- Front face (main) -->
    <polygon points="-50,-50 90,-50 90,65 -50,65" fill="url(#blenderGrad)"/>
    <!-- Top highlight -->
    <line x1="-50" y1="-50" x2="90" y2="-50" stroke="#FFB74D" stroke-width="2" opacity="0.5"/>
    <line x1="-50" y1="-50" x2="-70" y2="-95" stroke="#FFB74D" stroke-width="1" opacity="0.3"/>
    <!-- Inner detail lines -->
    <line x1="20" y1="-50" x2="20" y2="65" stroke="#FFAB91" stroke-width="0.5" opacity="0.2"/>
    <line x1="-50" y1="10" x2="90" y2="10" stroke="#FFAB91" stroke-width="0.5" opacity="0.2"/>
  </g>

  <!-- AI sparkle accents -->
  <g fill="#FFD54F" filter="url(#glow)" opacity="0.8">
    <polygon points="350,110 354,125 369,129 354,133 350,148 346,133 331,129 346,125"/>
    <polygon points="160,120 163,130 173,133 163,136 160,146 157,136 147,133 157,130" opacity="0.5"/>
    <polygon points="390,220 392,227 399,229 392,231 390,238 388,231 381,229 388,227" opacity="0.4"/>
  </g>

  <!-- MCP badge -->
  <g transform="translate(256, 395)">
    <rect x="-55" y="-18" width="110" height="36" rx="18" fill="#1565C0"/>
    <rect x="-53" y="-16" width="106" height="32" rx="16" fill="none" stroke="#64B5F6" stroke-width="1" opacity="0.4"/>
    <text x="0" y="7" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="bold" fill="white" text-anchor="middle" letter-spacing="3">MCP</text>
  </g>

  <!-- BLENDER text -->
  <text x="256" y="460" font-family="'Segoe UI', Arial, sans-serif" font-size="28" font-weight="bold" fill="#CFD8DC" text-anchor="middle" letter-spacing="6">BLENDER</text>

  <!-- Tool count ring -->
  <text x="256" y="490" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#546E7A" text-anchor="middle">218 Tools</text>
</svg>

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "meshwire"
dynamic = ["version"]
description = "An independent MCP server for Blender: modeling, materials, animation, AI 3D generation, and MSFS content"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.10"
authors = [
    { name = "Meshwire contributors" }
]
keywords = ["mcp", "blender", "3d", "model-context-protocol", "ai", "msfs", "flight-simulator", "livery", "aircraft"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
]

dependencies = [
    "mcp>=2.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "jsonschema>=4.0.0",
    "ruff>=0.3.0",
]

[project.scripts]
meshwire = "mcp_blender.server:main"
mcp-blender = "mcp_blender.server:main"

[project.urls]
Homepage = "https://github.com/RFingAdam/meshwire"
Repository = "https://github.com/RFingAdam/meshwire"
Issues = "https://github.com/RFingAdam/meshwire/issues"
Changelog = "https://github.com/RFingAdam/meshwire/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/mcp_blender/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_blender"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.format]
# Code blocks in the docs are illustrative fragments, not modules.
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]  # Line length handled pragmatically for readability

[tool.ruff.lint.per-file-ignores]
# Blender addons require bl_info before imports
"addon/blender_mcp_addon/__init__.py" = ["E402"]
# Blender integration test requires conditional imports and has intentional unused results
"tests/blender_integration_test.py" = ["E402", "F841"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
